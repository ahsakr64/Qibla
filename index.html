<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b17">
<title>Qibla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#d9b66a;--gold2:#f3dca0;--ink:#e9d8ac;--bg:#070b17;--card:rgba(8,12,24,.78);--ah:clamp(60px,10dvh,92px)}
html{height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100vh;height:100dvh;background:radial-gradient(120% 60% at 50% 0,#0f1b3a 0,#070b17 60%,#05070f 100%) fixed;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;overflow-x:hidden;overflow-y:auto}
#stars{position:fixed;inset:0;pointer-events:none}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:tw 4s infinite alternate}
@keyframes tw{to{opacity:.1}}
/* one-screen layout: everything is compact, the compass takes the leftover height */
.app{position:relative;max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 16px calc(env(safe-area-inset-bottom,0px) + 8px);text-align:center}
.app>*{flex:none}
.arch{display:block;width:calc(100% + 32px);margin:0 -16px;height:var(--ah);-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
h1{font-weight:500;font-size:clamp(38px,6.5dvh,52px);line-height:1;margin:calc(var(--ah)*-.45) 0 2px;color:var(--gold2);text-shadow:0 0 24px rgba(217,182,106,.35)}
.sub{font-size:17px;line-height:1.2;margin:0 0 6px;color:var(--gold)}
.div{display:block;width:40%;margin:0 auto 6px}
.pill{align-self:center;display:inline-flex;align-items:baseline;gap:8px;border:1px solid rgba(217,182,106,.6);border-radius:40px;padding:4px 22px;background:var(--card)}
.pill small{font-size:14px}.pill b{font-size:30px;font-weight:500;line-height:1.1;color:var(--gold2)}
.cmpw{flex:1 1 auto;min-height:130px;position:relative;margin:6px 0 0}
.cmp{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#ring{will-change:transform}
.al #glow{opacity:1}
#glow{opacity:.55;transition:opacity .3s}
#stat{min-height:20px;margin:4px 0 0;font-style:italic;font-size:15px;line-height:1.25;color:var(--gold)}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{margin:6px 0 0;display:inline-block;border:0;border-radius:30px;padding:9px 24px;font:600 17px 'Cormorant Garamond',Georgia,serif;color:#1a1304;background:linear-gradient(#f3dca0,#c9a45c);box-shadow:0 0 22px rgba(217,182,106,.4)}
.sky{display:block;width:calc(100% + 32px);margin:6px -16px 0;height:40px}
.loc{display:flex;align-items:center;justify-content:space-around;margin:6px 0 8px;border:1px solid rgba(217,182,106,.55);border-radius:40px;background:var(--card);padding:6px 8px;text-align:left}
.loc>div{display:flex;gap:8px;align-items:center;flex:1;justify-content:center}.loc>i{width:1px;height:30px;background:rgba(217,182,106,.4)}
.loc small,.card small{display:block;font-size:13px;line-height:1.2;color:var(--gold)}.loc b{font-size:18px;font-weight:500;color:var(--ink)}
.ico{width:26px;height:26px;flex:none}
.card{border:1px solid rgba(217,182,106,.55);border-radius:22px;background:var(--card);overflow:hidden;text-align:left}
.top{display:flex;align-items:center;padding:8px 14px}
.np{flex:1}.np b{display:block;font-size:30px;font-weight:500;line-height:1.05;color:var(--gold2)}.np span{font-size:18px;color:var(--gold)}
.vl{width:1px;align-self:stretch;background:rgba(217,182,106,.4);margin:0 12px}
.sr{flex:1;display:flex;gap:8px;align-items:center}.sr span{font-size:20px}
.row{display:flex;border-top:1px solid rgba(217,182,106,.35);background:rgba(0,0,0,.25)}
.row div{flex:1;text-align:center;padding:6px 0;font-size:16px;border-left:1px solid rgba(217,182,106,.3)}
.row div:first-child{border:0}.row small{font-size:14px;color:var(--ink)}.row span{display:block;font-size:16px;white-space:nowrap}
.row .on{background:rgba(217,182,106,.14)}.row .on small,.row .on span{color:var(--gold2);font-weight:600}
.meth{font-size:12px;line-height:1.2;color:var(--gold);opacity:.8;margin:6px 0 0}
.hij{margin:4px 0 0;font-size:15px;line-height:1.2;opacity:.85}
@media (max-height:780px){.div{display:none}}
@media (max-height:700px){.sky{display:none}}
</style>
</head>
<body>
<div id="stars"></div>
<main class="app">
<svg class="arch" viewBox="0 0 480 150" aria-hidden="true">
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dca0"/><stop offset=".5" stop-color="#c9a45c"/><stop offset="1" stop-color="#8a6a2f"/></linearGradient>
<mask id="cm"><rect width="480" height="150" fill="#fff"/><circle cx="256" cy="46" r="19" fill="#000"/></mask></defs>
<path d="M0 128C60 118 92 96 102 72C118 38 196 44 240 10C284 44 362 38 378 72C388 96 420 118 480 128" fill="none" stroke="url(#g)" stroke-width="2.5"/>
<path d="M0 142C64 130 100 108 112 84C128 52 200 56 240 24C280 56 352 52 368 84C380 108 416 130 480 142" fill="none" stroke="url(#g)" stroke-width="1" opacity=".5"/>
<circle cx="240" cy="62" r="24" fill="url(#g)" mask="url(#cm)"/>
</svg>
<h1>Qibla</h1>
<p class="sub">Find the direction to the Kaaba</p>
<svg class="div" viewBox="0 0 300 20"><path d="M0 10H125M175 10H300" stroke="#d9b66a" stroke-width="1.2" opacity=".7"/><g fill="none" stroke="#d9b66a" stroke-width="1.4"><circle cx="150" cy="10" r="3"/><path d="M150 1l4 5 5-1-1 5 5 4-5 1 1 5-5-1-4 5-4-5-5 1 1-5-5-1 5-4-1-5 5 1z" transform="scale(.9) translate(16 1)"/></g></svg>
<div class="pill"><small>Qibla is at</small><b id="qd">--°</b><small>from North</small></div>

<div class="cmpw">
<svg class="cmp" id="cmp" viewBox="-12 -12 364 364" role="img" aria-label="Qibla compass">
<defs>
<linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3dca0"/><stop offset=".5" stop-color="#b8903f"/><stop offset="1" stop-color="#f3dca0"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070d20"/><stop offset="1" stop-color="#22305a"/></linearGradient>
<linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a48"/><stop offset="1" stop-color="#0b0d16"/></linearGradient>
<pattern id="win" width="7" height="12" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="3" height="6" rx="1.4" fill="#f3c96a" opacity=".8"/></pattern>
<clipPath id="cc"><circle cx="170" cy="170" r="101"/></clipPath>
<filter id="bl"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<circle cx="170" cy="170" r="160" fill="#080c18" stroke="url(#gd)" stroke-width="3"/>
<circle cx="170" cy="170" r="166" fill="none" stroke="#d9b66a" stroke-width="1" opacity=".45"/>
<g clip-path="url(#cc)">
<rect x="60" y="60" width="220" height="220" fill="url(#sky)"/>
<rect x="60" y="190" width="220" height="90" fill="url(#fl)"/>
<g fill="#10131e"><rect x="60" y="164" width="220" height="26"/><path d="M72 164a13 13 0 0 1 26 0zM242 164a13 13 0 0 1 26 0z"/><rect x="82" y="120" width="5" height="44"/><rect x="253" y="120" width="5" height="44"/><path d="M80 120l4.5-12 4.5 12zM251 120l4.5-12 4.5 12z"/></g>
<rect x="60" y="168" width="220" height="20" fill="url(#win)"/>
<ellipse cx="170" cy="206" rx="64" ry="9" fill="#e8b84a" opacity=".5" filter="url(#bl)"/>
<path d="M126 144L170 150L170 206L126 198z" fill="#08080b"/>
<path d="M170 150L214 144L214 198L170 206z" fill="#16161c"/>
<path d="M126 153L170 159L170 166L126 160zM170 159L214 153L214 160L170 166z" fill="url(#gd)"/>
<rect x="190" y="176" width="9" height="19" fill="#f3c96a" opacity=".85"/>
</g>
<circle cx="170" cy="170" r="101" fill="none" stroke="#d9b66a" stroke-width="1.2" opacity=".8"/>
<g id="ring"><g id="ticks" stroke="#d9b66a" stroke-linecap="round"></g>
<g font-size="26" fill="#d9b66a" text-anchor="middle" dominant-baseline="central"><text x="170" y="30" fill="#f3dca0">N</text><text x="310" y="170">E</text><text x="170" y="310">S</text><text x="30" y="170">W</text></g>
<g id="arrow"><g id="glow"><circle cx="170" cy="10" r="9" fill="#ffe9a8" filter="url(#bl)"/><circle cx="170" cy="10" r="4.5" fill="#fff6d6"/><rect x="167" y="70" width="6" height="90" fill="#f3c96a" filter="url(#bl)" opacity=".7"/></g><rect x="169" y="70" width="2.6" height="92" fill="url(#gd)"/><path d="M170 50L158 78L182 78z" fill="url(#gd)" stroke="#fff3c4" stroke-width=".6"/></g></g>
<path d="M170 -8L162 -20L178 -20z" transform="translate(0 4)" fill="#f3dca0"/>
</svg>
</div>
<p id="stat">Tap below to start the compass</p>
<div class="acts"><button class="btn" id="go">Enable compass &amp; location</button><button class="btn" id="man" style="display:none;background:none;color:#d9b66a;border:1px solid #d9b66a;box-shadow:none">Enter manually</button></div>

<svg class="sky" id="sky" viewBox="0 0 480 100" preserveAspectRatio="none" aria-hidden="true"></svg>

<div class="loc"><div><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#d9b66a" stroke-width="1.8"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg><span><small>Your Location</small><b id="lc">Locating…</b></span></div><i></i><div><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#d9b66a" stroke-width="1.8"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.4"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg><span><small>Accuracy</small><b id="ac">—</b></span></div></div>

<section class="card">
<div class="top"><div class="np"><small>Next Prayer</small><b id="npn">—</b><span id="npt">Waiting for location</span></div><i class="vl"></i><div class="sr"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#d9b66a" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><small>Sunrise</small><span id="srt">—</span></div></div></div>
<div class="row" id="row"></div>
</section>
<p class="meth" id="meth"></p>
<svg class="div" viewBox="0 0 300 20" aria-hidden="true"><path d="M0 10H125M175 10H300" stroke="#d9b66a" stroke-width="1.2" opacity=".7"/><circle cx="150" cy="10" r="6" fill="none" stroke="#d9b66a" stroke-width="1.4"/><circle cx="150" cy="10" r="2" fill="#d9b66a"/></svg>
<p class="hij" id="hij"></p>
</main>
<script>
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const R=Math.PI/180,sin=d=>Math.sin(d*R),cos=d=>Math.cos(d*R),tan=d=>Math.tan(d*R);
const asin=x=>Math.asin(x)/R,acos=x=>Math.acos(x)/R,atan2=(y,x)=>Math.atan2(y,x)/R,acot=x=>Math.atan(1/x)/R;
const fix=(a,b)=>a-b*Math.floor(a/b);
// stars, ticks, skyline
for(let i=0;i<70;i++){const s=document.createElement('i');s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*4}s;transform:scale(${.5+Math.random()})`;$('stars').appendChild(s)}
let t='';for(let a=0;a<360;a+=5){if(a%90===0||Math.abs(((a+45)%90)-45)<8&&a%90<8&&false)continue;const near=[0,90,180,270].some(c=>Math.abs(fix(a-c+180,360)-180)<9);if(near)continue;const L=a%10===0?12:6;t+=`<line x1="170" y1="${14}" x2="170" y2="${14+L}" stroke-width="${a%30===0?2:1.2}" opacity="${a%10===0?.9:.5}" transform="rotate(${a} 170 170)"/>`}
$('ticks').innerHTML=t;
(function(){let s='<rect y="64" width="480" height="36" fill="#0a0e1b"/><rect y="64" width="480" height="30" fill="url(#win2)"/><defs><pattern id="win2" width="8" height="12" patternUnits="userSpaceOnUse"><rect x="2.5" y="3" width="3" height="6" rx="1.4" fill="#f3c96a" opacity=".75"/></pattern><linearGradient id="hz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e1b" stop-opacity="0"/><stop offset="1" stop-color="#070b17"/></linearGradient></defs>';
[[70,26,26],[160,18,16],[240,36,40],[320,18,16],[410,26,26]].forEach(([x,w,h])=>s+=`<path d="M${x-w} 64A${w} ${h} 0 0 1 ${x+w} 64z" fill="#0d1222"/><path d="M${x-w} 64h${2*w}v4h-${2*w}z" fill="#f3c96a" opacity=".35"/><path d="M${x} ${64-h}v-7" stroke="#d9b66a"/>`);
[18,120,360,462].forEach((x,i)=>s+=`<rect x="${x-3}" y="${i%3?24:10}" width="6" height="${i%3?40:54}" fill="#0d1222"/><path d="M${x-4} ${i%3?24:10}l4-12 4 12z" fill="#0d1222"/><rect x="${x-1.5}" y="${(i%3?24:10)+8}" width="3" height="5" fill="#f3c96a"/>`);
$('sky').innerHTML=s+'<rect y="60" width="480" height="40" fill="url(#hz)" opacity=".5"/>'})();

// qibla bearing
const KAABA=[21.4225,39.8262];
function qibla(lat,lng){const dl=(KAABA[1]-lng)*R,p1=lat*R,p2=KAABA[0]*R;return fix(Math.atan2(Math.sin(dl),Math.cos(p1)*Math.tan(p2)-Math.sin(p1)*Math.cos(dl))/R,360)}

// prayer times
function jd(y,m,d){if(m<=2){y--;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sun(j){const D=j-2451545,g=fix(357.529+.98560028*D,360),q=fix(280.459+.98564736*D,360),L=fix(q+1.915*sin(g)+.02*sin(2*g),360),e=23.439-3.6e-7*D,ra=fix(atan2(cos(e)*sin(L),cos(L))/15,24);return{dec:asin(sin(e)*sin(L)),eq:fix(q/15-ra+12,24)-12}}
function times(dt,lat,lng,M){
 const y=dt.getFullYear(),mo=dt.getMonth(),d=dt.getDate(),J=jd(y,mo+1,d)-lng/360,mid=t=>fix(12-sun(J+t).eq,24);
 const H=(alt,t)=>{const s=sun(J+t);return acos((sin(alt)-sin(s.dec)*sin(lat))/(cos(s.dec)*cos(lat)))/15};
 const calc=T=>{const dec=sun(J+T[2]).dec;return[mid(T[0])-H(-M.f,T[0]),mid(T[1])-H(-.833,T[1]),mid(T[2])+1/60,mid(T[3])+H(acot((M.h?2:1)+tan(Math.abs(lat-dec))),T[3]),mid(T[4])+H(-.833,T[4]),M.im?0:mid(T[5])+H(-M.i,T[5])]};
 const def=[5,6,12,13,18,18].map(x=>x/24);let r=calc(def);r=calc(r.map((v,i)=>isNaN(v)?def[i]:i==5&&M.im?18/24:v/24));
 let[fj,sr,dh,as,ss,is]=r;
 if(M.im)is=ss+M.im/60;
 const night=sr+24-ss;if(isNaN(fj))fj=sr-night/7;if(isNaN(is))is=ss+night/7;
 const u=h=>new Date(Date.UTC(y,mo,d)+(h-lng/15)*36e5);
 return{fajr:u(fj),sr:u(sr),dh:u(dh),asr:u(as),mg:u(ss),isha:u(is)}}
function method(tz){
 if(/Riyadh|Qatar|Kuwait|Bahrain|Aden|Muscat/.test(tz))return{n:'Umm al-Qura',f:18.5,i:0,im:90};
 if(/Dubai/.test(tz))return{n:'Gulf Region',f:18.2,i:18.2};
 if(/Cairo|Khartoum|Juba|Tripoli|Beirut|Damascus|Amman|Jerusalem|Gaza|Baghdad/.test(tz))return{n:'Egyptian General Authority',f:19.5,i:17.5};
 if(/Karachi|Kolkata|Calcutta|Dhaka|Kabul|Colombo|Kathmandu/.test(tz))return{n:'Univ. of Islamic Sciences, Karachi',f:18,i:18,h:1};
 if(/^(America|US|Canada)\//.test(tz)||/Honolulu|Anchorage/.test(tz))return{n:'ISNA (North America)',f:15,i:15};
 if(/Singapore|Kuala_Lumpur|Jakarta|Makassar|Jayapura|Brunei|Pontianak/.test(tz))return{n:'Southeast Asia (MUIS)',f:20,i:18};
 if(/Tehran/.test(tz))return{n:'Tehran',f:17.7,i:14};
 return{n:'Muslim World League',f:18,i:17}}
const fmt=d=>isNaN(d)?'--':((h,m)=>(h%12||12)+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM'))(d.getHours(),d.getMinutes());

// state
let pos=null,M=null,q=0,heading=null,shown=0,cAcc=null,gAcc=null,wasAl=false;
const names=['Fajr','Dhuhr','Asr','Maghrib','Isha'];
$('row').innerHTML=names.map((n,i)=>`<div id="p${i}"><small>${n}</small><span>—</span></div>`).join('');
function hij(){try{const now=new Date(),d=(pos&&M&&now>times(now,pos[0],pos[1],M).mg)?new Date(+now+864e5):now,f=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).formatToParts(d),g=k=>(f.find(p=>p.type===k)||{}).value;$('hij').textContent=`${g('year').replace(/\D/g,'')} AH  •  ${g('month')} ${g('day')}`}catch(e){}}
function tick(){hij();if(!pos)return;
 const now=new Date(),day=k=>times(new Date(now.getFullYear(),now.getMonth(),now.getDate()+k),pos[0],pos[1],M),t0=day(0),L=[t0.fajr,t0.dh,t0.asr,t0.mg,t0.isha];
 let i=L.findIndex(d=>d>now),tg,sr=t0.sr;
 if(i<0){const t1=day(1);tg=t1.fajr;i=0;sr=t1.sr}else tg=L[i];
 L.forEach((d,k)=>{const e=$('p'+k);e.lastChild.textContent=fmt(d);e.className=k===i?'on':''});
 const mins=Math.max(0,Math.floor((tg-now)/6e4)),h=Math.floor(mins/60);
 $('npn').textContent=names[i];$('npt').textContent=mins<1?'in <1m':'in '+(h?h+'h ':'')+mins%60+'m';$('srt').textContent=fmt(sr)}
// real city name from coordinates (falls back silently to the time-zone name if offline or slow)
async function place(lat,lng){
 try{const c=new AbortController(),to=setTimeout(()=>c.abort(),8000);
  const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`,{signal:c.signal});clearTimeout(to);
  if(!r.ok)return;const d=await r.json(),n=d.city||d.locality||d.principalSubdivision;
  if(n&&pos&&pos[0]===lat&&pos[1]===lng)$('lc').textContent=n}catch(e){}}
function ok(p){pos=[p.coords.latitude,p.coords.longitude];gAcc=p.coords.accuracy;q=qibla(pos[0],pos[1]);
 $('qd').textContent=Math.round(q)+'°';$('arrow').setAttribute('transform',`rotate(${q} 170 170)`);
 const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';M=method(tz);
 $('lc').textContent=(tz.split('/').pop()||'Here').replace(/_/g,' ');
 place(pos[0],pos[1]);
 $('meth').textContent=`Prayer times: ${M.n}, selected automatically for your region`;
 acc();tick();stat()}
function acc(){$('ac').textContent=cAcc>0?'± '+Math.round(cAcc)+'°':gAcc?'± '+Math.round(gAcc)+' m':'—'}
function stat(){const s=$('stat');if(!pos){return}if(heading==null){s.textContent='Compass not available — use the bearing above with a physical compass';return}
 const d=fix(q-heading+180,360)-180;s.textContent=Math.abs(d)<3?'You are facing the Qibla':'Turn '+(d>0?'right ':'left ')+Math.abs(Math.round(d))+'°. Hold your phone flat';}
function onOri(e){let h;if(e.webkitCompassHeading!=null){h=e.webkitCompassHeading;if(e.webkitCompassAccuracy>=0&&e.webkitCompassAccuracy!=null)cAcc=e.webkitCompassAccuracy}else if(e.absolute&&e.alpha!=null)h=360-e.alpha;else return;
 heading=fix(h+((screen.orientation&&screen.orientation.angle)||0),360)}
function loop(){if(heading!=null){shown+=(fix(heading-shown+180,360)-180)*.2;$('ring').setAttribute('transform',`rotate(${-shown} 170 170)`);
 const al=pos&&Math.abs(fix(q-shown+180,360)-180)<3;$('cmp').classList.toggle('al',!!al);
 if(al&&!wasAl&&navigator.vibrate)navigator.vibrate(40);wasAl=al}
 requestAnimationFrame(loop)}
loop();setInterval(()=>{tick();if(pos){acc();stat()}},1000);
$('go').onclick=async()=>{
 const b=$('go');b.style.display='none';$('stat').textContent='Starting…';
 try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')$('stat').textContent='Compass permission denied. Enable motion access for this site in Settings.'}}catch(e){}
